name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed vX.Y.Z tag to validate, verify, or synchronize
        required: true
        type: string
      mode:
        description: Dry run, non-mutating tap verification, or recovery synchronization
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - verify-tap
          - sync-tap

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  preflight:
    runs-on: macos-14
    outputs:
      commit: ${{ steps.contract.outputs.commit }}
      mode: ${{ steps.contract.outputs.mode }}
      tag: ${{ steps.contract.outputs.tag }}
      version: ${{ steps.contract.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Validate release contract
        id: contract
        env:
          RELEASE_PIPELINE_ENABLED: ${{ vars.RELEASE_PIPELINE_ENABLED }}
          TAP_APP_ID: ${{ vars.TAP_APP_ID }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          REQUESTED_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'release' }}
        run: |
          set -euo pipefail
          if [[ "${REQUESTED_MODE}" == "release" && "${RELEASE_PIPELINE_ENABLED}" != "true" ]]; then
            echo "error: configure the protected release Environment, then set repository variable RELEASE_PIPELINE_ENABLED=true before publishing" >&2
            exit 1
          fi
          if [[ "${REQUESTED_MODE}" != "dry-run" && -z "${TAP_APP_ID}" ]]; then
            echo "error: configure repository variable TAP_APP_ID before verifying or publishing the Homebrew tap" >&2
            exit 1
          fi
          bash scripts/release-preflight.sh "${RELEASE_TAG}"
          {
            echo "mode=${REQUESTED_MODE}"
            echo "tag=${RELEASE_TAG}"
            echo "version=${RELEASE_TAG#v}"
            echo "commit=$(git rev-list -n1 "${RELEASE_TAG}")"
          } >> "${GITHUB_OUTPUT}"

  build-native:
    needs: preflight
    if: needs.preflight.outputs.mode != 'sync-tap' && needs.preflight.outputs.mode != 'verify-tap'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-macos
            uname: x86_64
          - runner: macos-14
            target: aarch64-macos
            uname: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Assert native runner architecture
        run: test "$(uname -m)" = "${{ matrix.uname }}"

      - name: Check out tagged source
        run: git worktree add --detach source "${{ needs.preflight.outputs.tag }}"

      - name: Validate source and build
        working-directory: source
        run: |
          set -euo pipefail
          zig fmt --check build.zig build.zig.zon src/*.zig
          bash scripts/check-version.sh "${{ needs.preflight.outputs.tag }}"
          bash scripts/check-cli-assets.sh
          bash -n completions/localports.bash
          zsh -n completions/_localports
          if command -v fish >/dev/null; then fish -n completions/localports.fish; fi
          mandoc -Tlint man/localports.1
          ruby -c Formula/localports.rb
          zig build -Doptimize=ReleaseFast
          zig build test
          ./zig-out/bin/localports --help >/dev/null
          ./zig-out/bin/localports --version | grep "^localports ${{ needs.preflight.outputs.version }}$"
          ./zig-out/bin/localports --json | python3 -m json.tool >/dev/null

      - name: Package and verify native archive
        working-directory: source
        run: |
          set -euo pipefail
          LOCALPORTS_RELEASE_TARGETS="${{ matrix.target }}" bash "${GITHUB_WORKSPACE}/scripts/package-release.sh" dist
          bash "${GITHUB_WORKSPACE}/scripts/verify-release-archive.sh" "dist/localports-${{ matrix.target }}.tar.gz" "${{ matrix.target }}"

      - name: Upload architecture archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: source/dist/localports-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  assemble-and-attest:
    needs:
      - preflight
      - build-native
    if: needs.preflight.outputs.mode != 'sync-tap' && needs.preflight.outputs.mode != 'verify-tap'
    runs-on: macos-14
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*-macos
          path: release
          merge-multiple: true

      - name: Create manifest and checksums
        run: |
          set -euo pipefail
          python3 scripts/create-release-manifest.py \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --commit "${{ needs.preflight.outputs.commit }}" \
            --zig-version "$(zig version)" \
            --output-dir release \
            --artifact "aarch64-macos=release/localports-aarch64-macos.tar.gz" \
            --artifact "x86_64-macos=release/localports-x86_64-macos.tar.gz"
          (
            cd release
            shasum -a 256 -c SHA256SUMS
          )

      - name: Attest release archives
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e # v3.0.0
        with:
          subject-path: release/*.tar.gz

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-metadata
          path: |
            release/SHA256SUMS
            release/release-manifest.json
          if-no-files-found: error
          retention-days: 14

  stage-draft:
    needs:
      - preflight
      - assemble-and-attest
    if: needs.preflight.outputs.mode == 'release'
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*-macos
          path: release
          merge-multiple: true

      - name: Download release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-metadata
          path: release

      - name: Create or verify draft release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            test "$(gh release view "${TAG}" --json isDraft --jq .isDraft)" = "true"
          else
            gh release create "${TAG}" --draft --title "${TAG}" --generate-notes
          fi

          mkdir existing
          for asset in release/localports-*.tar.gz release/SHA256SUMS release/release-manifest.json; do
            name="$(basename "${asset}")"
            if gh release download "${TAG}" --pattern "${name}" --dir existing >/dev/null 2>&1; then
              test "$(shasum -a 256 "${asset}" | awk '{print $1}')" = "$(shasum -a 256 "existing/${name}" | awk '{print $1}')"
            else
              gh release upload "${TAG}" "${asset}"
            fi
          done

  promote-and-sync-tap:
    needs:
      - preflight
      - stage-draft
    if: needs.preflight.outputs.mode == 'release'
    runs-on: macos-14
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Download release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir release
          gh release download "${TAG}" --dir release
          (
            cd release
            shasum -a 256 -c SHA256SUMS
          )

      - name: Publish verified draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: gh release edit "${TAG}" --draft=false

      - name: Mint tap token
        id: tap-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.11.0
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: imrajyavardhan12
          repositories: homebrew-localports

      - name: Check out Homebrew tap
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          repository: imrajyavardhan12/homebrew-localports
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-localports
          fetch-depth: 1

      - name: Synchronize Homebrew tap
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          arm_sha="$(awk '$2 == "localports-aarch64-macos.tar.gz" { print $1 }' release/SHA256SUMS)"
          x64_sha="$(awk '$2 == "localports-x86_64-macos.tar.gz" { print $1 }' release/SHA256SUMS)"
          test -n "${arm_sha}"
          test -n "${x64_sha}"
          bash scripts/sync-homebrew-tap.sh homebrew-localports "${TAG}" "${arm_sha}" "${x64_sha}"

  sync-tap:
    needs: preflight
    if: needs.preflight.outputs.mode == 'sync-tap'
    runs-on: macos-14
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Download and verify published release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "${TAG}" --json isDraft --jq .isDraft)" = "false"
          mkdir release
          gh release download "${TAG}" --dir release
          (
            cd release
            shasum -a 256 -c SHA256SUMS
          )

      - name: Mint tap token
        id: tap-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.11.0
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: imrajyavardhan12
          repositories: homebrew-localports

      - name: Check out Homebrew tap
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          repository: imrajyavardhan12/homebrew-localports
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-localports
          fetch-depth: 1

      - name: Synchronize Homebrew tap
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          arm_sha="$(awk '$2 == "localports-aarch64-macos.tar.gz" { print $1 }' release/SHA256SUMS)"
          x64_sha="$(awk '$2 == "localports-x86_64-macos.tar.gz" { print $1 }' release/SHA256SUMS)"
          test -n "${arm_sha}"
          test -n "${x64_sha}"
          bash scripts/sync-homebrew-tap.sh homebrew-localports "${TAG}" "${arm_sha}" "${x64_sha}"

  verify-tap:
    needs: preflight
    if: needs.preflight.outputs.mode == 'verify-tap'
    runs-on: macos-14
    environment: release
    permissions:
      contents: read
    steps:
      - name: Mint tap token
        id: tap-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.11.0
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: imrajyavardhan12
          repositories: homebrew-localports

      - name: Check out Homebrew tap
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          repository: imrajyavardhan12/homebrew-localports
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-localports
          fetch-depth: 1

      - name: Verify tap write permission
        run: git -C homebrew-localports push --dry-run origin HEAD:main

      - name: Validate checked-out formula
        run: |
          set -euo pipefail
          formula="homebrew-localports/Formula/localports.rb"
          test -f "${formula}"
          ruby -c "${formula}"
