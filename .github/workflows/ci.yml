name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# mlugg/setup-zig has no Node 24 release yet (latest v2.2.1 still declares
# node20). Opt its action runtime into Node 24 ahead of GitHub's forced
# 2026-06-16 switch so CI proves it still works. Remove once setup-zig ships a
# Node 24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  macos:
    name: macOS Zig 0.16
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src/*.zig

      - name: Check version metadata
        run: bash scripts/check-version.sh

      - name: Check CLI assets
        run: |
          bash scripts/check-cli-assets.sh
          bash -n completions/localports.bash
          zsh -n completions/_localports
          if command -v fish >/dev/null; then fish -n completions/localports.fish; fi
          mandoc -Tlint man/localports.1
          ruby -c Formula/localports.rb

      - name: Check release automation
        run: |
          bash -n scripts/package-release.sh
          bash -n scripts/release-preflight.sh
          bash -n scripts/render-homebrew-formula.sh
          bash -n scripts/sync-homebrew-tap.sh
          bash -n scripts/verify-release-archive.sh
          python3 -m py_compile scripts/create-release-manifest.py scripts/check-performance.py
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release.yml")'

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Test
        run: zig build test

      - name: Check scan performance
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          baseline_src="${RUNNER_TEMP}/localports-baseline"
          baseline_prefix="${RUNNER_TEMP}/localports-baseline-build"
          candidate_prefix="${RUNNER_TEMP}/localports-candidate-build"
          git worktree add --detach "${baseline_src}" "${BASE_SHA}"
          (
            cd "${baseline_src}"
            zig build -Doptimize=ReleaseFast --prefix "${baseline_prefix}"
          )
          zig build -Doptimize=ReleaseFast --prefix "${candidate_prefix}"
          python3 scripts/check-performance.py \
            --baseline "${baseline_prefix}/bin/localports" \
            --candidate "${candidate_prefix}/bin/localports"

      - name: Smoke test help
        run: ./zig-out/bin/localports --help

      - name: Smoke test version
        run: ./zig-out/bin/localports --version | grep '^localports '

      - name: Smoke test JSON
        run: ./zig-out/bin/localports --json | python3 -m json.tool > /dev/null

      - name: Package release binaries (cross-compile check)
        run: bash scripts/package-release.sh dist

      - name: Smoke test packaged arm64 binary
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf dist/localports-aarch64-macos.tar.gz -C "${tmp}"
          "${tmp}/localports" --version | grep '^localports '
