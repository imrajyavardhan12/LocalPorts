name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# mlugg/setup-zig has no Node 24 release yet (latest v2.2.1 still declares
# node20). Opt its action runtime into Node 24 ahead of GitHub's forced
# 2026-06-16 switch so CI proves it still works. Remove once setup-zig ships a
# Node 24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  macos:
    name: macOS Zig 0.16
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src/*.zig

      - name: Check version metadata
        run: bash scripts/check-version.sh

      - name: Check CLI assets
        run: |
          bash scripts/check-cli-assets.sh
          bash -n completions/localports.bash
          zsh -n completions/_localports
          if command -v fish >/dev/null; then fish -n completions/localports.fish; fi
          mandoc -Tlint man/localports.1
          ruby -c Formula/localports.rb

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Test
        run: zig build test

      - name: Smoke test help
        run: ./zig-out/bin/localports --help

      - name: Smoke test version
        run: ./zig-out/bin/localports --version | grep '^localports '

      - name: Smoke test JSON
        run: ./zig-out/bin/localports --json | python3 -m json.tool > /dev/null

      - name: Package release binaries (cross-compile check)
        run: bash scripts/package-release.sh dist

      - name: Smoke test packaged arm64 binary
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf dist/localports-aarch64-macos.tar.gz -C "${tmp}"
          "${tmp}/localports" --version | grep '^localports '
