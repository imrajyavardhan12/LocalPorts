name: Release

on:
  release:
    types: [published]

# Upload built binaries back to the release; the tap push uses TAP_GITHUB_TOKEN.
permissions:
  contents: write

# mlugg/setup-zig has no Node 24 release yet (latest v2.2.1 still declares
# node20). Opt its action runtime into Node 24 ahead of GitHub's forced
# 2026-06-16 switch. Remove once setup-zig ships a Node 24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Validate release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/check-version.sh "${TAG}"

      - name: Build and package macOS binaries
        run: bash scripts/package-release.sh dist

      - name: Smoke test arm64 binary
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf dist/localports-aarch64-macos.tar.gz -C "${tmp}"
          "${tmp}/localports" --version | grep '^localports '
          "${tmp}/localports" --help >/dev/null

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${TAG}" \
            dist/localports-aarch64-macos.tar.gz \
            dist/localports-x86_64-macos.tar.gz \
            --clobber

      - name: Compute asset metadata
        id: assets
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          base="https://github.com/${REPO}/releases/download/${TAG}"
          arm_sha=$(shasum -a 256 dist/localports-aarch64-macos.tar.gz | awk '{print $1}')
          x64_sha=$(shasum -a 256 dist/localports-x86_64-macos.tar.gz | awk '{print $1}')
          {
            echo "version=${TAG#v}"
            echo "arm_url=${base}/localports-aarch64-macos.tar.gz"
            echo "arm_sha=${arm_sha}"
            echo "x64_url=${base}/localports-x86_64-macos.tar.gz"
            echo "x64_sha=${x64_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Clone tap repo
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://${TOKEN}@github.com/${OWNER}/homebrew-localports.git"

      - name: Update formula
        env:
          VERSION: ${{ steps.assets.outputs.version }}
          ARM_URL: ${{ steps.assets.outputs.arm_url }}
          ARM_SHA: ${{ steps.assets.outputs.arm_sha }}
          X64_URL: ${{ steps.assets.outputs.x64_url }}
          X64_SHA: ${{ steps.assets.outputs.x64_sha }}
        run: |
          set -euo pipefail
          mkdir -p homebrew-localports/Formula
          cp Formula/localports.rb homebrew-localports/Formula/localports.rb
          cd homebrew-localports
          sed -i.bak \
            -e "s|VERSION_PLACEHOLDER|${VERSION}|" \
            -e "s|AARCH64_URL_PLACEHOLDER|${ARM_URL}|" \
            -e "s|AARCH64_SHA_PLACEHOLDER|${ARM_SHA}|" \
            -e "s|X86_64_URL_PLACEHOLDER|${X64_URL}|" \
            -e "s|X86_64_SHA_PLACEHOLDER|${X64_SHA}|" \
            Formula/localports.rb
          rm -f Formula/localports.rb.bak
          ruby -c Formula/localports.rb
          if grep -q PLACEHOLDER Formula/localports.rb; then
            echo "error: unreplaced placeholder remains in formula" >&2
            exit 1
          fi
          grep -F "${ARM_SHA}" Formula/localports.rb >/dev/null
          grep -F "${X64_SHA}" Formula/localports.rb >/dev/null

      - name: Commit and push
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd homebrew-localports
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/localports.rb
          git commit -m "Update localports formula to ${TAG}" || exit 0
          git push
