name: Update Homebrew Tap

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/check-version.sh "${TAG}"

      - name: Compute tarball SHA
        id: tarball
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          URL="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -fsSL "$URL" | sha256sum | awk '{print $1}')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Clone tap repo
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://${TOKEN}@github.com/${OWNER}/homebrew-localports.git"

      - name: Update formula
        env:
          URL: ${{ steps.tarball.outputs.url }}
          SHA: ${{ steps.tarball.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p homebrew-localports/Formula
          cp Formula/localports.rb homebrew-localports/Formula/localports.rb
          cd homebrew-localports
          perl -0pi -e 's|^  url ".*"|  url "$ENV{URL}"|m' Formula/localports.rb
          perl -0pi -e 's|^  sha256 ".*"|  sha256 "$ENV{SHA}"|m' Formula/localports.rb
          grep -F "${URL}" Formula/localports.rb
          grep -F "${SHA}" Formula/localports.rb

      - name: Commit and push
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd homebrew-localports
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/localports.rb
          git commit -m "Update localports formula to ${TAG}" || exit 0
          git push
